name: Model-owned motion boundary
on: [pull_request, push]
jobs:
  ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: No body repair or goal-driven actuator in production hooks
        run: python -m unittest discover -s tests -v
