name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

jobs:
  release:
    uses: RemoteMedia-SDK/remotemedia-plugin-sdk/.github/workflows/build-plugin.yml@main
    with:
      crate-name:   cc-render-plugin
      display-name: cc-render
      # Bevy audio (alsa-sys) and gamepad input (gilrs -> libudev-sys) need these headers.
      linux-apt-packages: libasound2-dev libudev-dev
      tag:          ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write
